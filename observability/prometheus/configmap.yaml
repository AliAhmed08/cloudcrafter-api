apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: cloudcrafter-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - users:3000
              - events:3000
              - tickets:3000
              - notifications:3000
            labels:
              app: cloudcrafter

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
