# Default values for the cloudcrafter chart.
# Tuned for local Minikube out of the box. Override any of this with
# -f values-<env>.yaml or --set for other environments (later Task 2 steps).

global:
  # Left empty on purpose: when unset, every resource is created in whatever
  # namespace `helm install -n <namespace>` targets (Helm/kubectl's normal
  # behavior). This chart intentionally does NOT hardcode a namespace name
  # anywhere, so the identical chart can later be installed into `aws` and
  # `google-cloud` namespaces (Task 2, later step) just by changing the
  # `-n`/`--namespace` flag at install time — no template or values change
  # needed for that alone.
  namespaceOverride: ""

  # Applied to every resource this chart creates, in addition to the
  # standard Helm labels from _helpers.tpl. Use this for environment tags
  # (e.g. cloud: aws) once multi-environment deploys are implemented — left
  # empty here since Task 2A doesn't implement that yet.
  extraLabels: {}

imagePullPolicy: IfNotPresent

# ------------------------------------------------------------------------
# Two deployment modes, driven by these two optional overrides:
#
#   Local mode (default, unset): each service uses its own
#   services.<name>.image.repository/tag below as-is — e.g. "users:1.0" —
#   exactly what Task 1's `minikube image load` workflow expects. Nothing
#   below needs to change for local Minikube development.
#
#   CI/GHCR mode: set these two values (e.g. via --set at install time, or
#   an Argo CD Application's helm.parameters — see argocd/), and every
#   service's image is automatically rewritten to
#   "<imageRegistry>/cloudcrafter-<service>:<imageTag>" without editing any
#   per-service value or template. This is what keeps a real registry
#   owner/org from being hardcoded anywhere in this chart.
#
# Example (see README.md "GHCR + Helm integration" for the full walkthrough):
#   helm install cloudcrafter ./charts/cloudcrafter \
#     --set imageRegistry=ghcr.io/aliahmed08 \
#     --set imageTag=1.0.0
# ------------------------------------------------------------------------
imageRegistry: ""
imageTag: ""

# ------------------------------------------------------------------------
# Only needed if your GHCR images are PRIVATE. Public GHCR images (the
# default for a public GitHub repo unless you explicitly restrict package
# visibility) need nothing here — leave this empty.
#
# If you've made the ghcr.io/<owner>/cloudcrafter-* packages private,
# Kubernetes needs a docker-registry Secret to pull them. Create it once
# (see README.md "CI/CD" -> "How Kubernetes pulls the images" for the exact
# command, using a GitHub Personal Access Token with read:packages scope —
# never commit that token anywhere), then reference its name here:
#
#   imagePullSecrets:
#     - ghcr-pull-secret
# ------------------------------------------------------------------------
imagePullSecrets: []

# ------------------------------------------------------------------------
# Security hardening (Phase 9). Applied to every service identically —
# none of the four services need root, extra Linux capabilities, or a
# writable root filesystem at runtime (all four are stateless Express apps;
# any scratch space they might need is covered by the /tmp emptyDir mounted
# on every container). node:18-alpine's default "node" user (uid 1000) is
# already what the Dockerfiles run as (see services/*/Dockerfile) — this
# just makes Kubernetes enforce the same thing independently of the image.
# ------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ------------------------------------------------------------------------
# Ingress — mirrors k8s/ingress.yaml (Task 1 baseline), now templated and
# configurable. cloudcrafter.local stays the default local-dev host.
# ------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: cloudcrafter.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2

# ------------------------------------------------------------------------
# JWT keys for the Users service. The chart NEVER creates a Secret
# containing real key material — it only references one that must already
# exist in the cluster (see README.md "Helm Deployment" -> step 1).
# ------------------------------------------------------------------------
jwt:
  existingSecret: users-jwt-keys
  # The Secret must contain: current-private.key, current-public.key,
  # current-kid (always required), and optionally previous-public.key,
  # previous-kid (only present during an active rotation's grace period —
  # see docs/jwt-key-rotation.md). The chart mounts the whole Secret rather
  # than pinning individual filenames, since the optional previous-* files
  # may or may not exist depending on rotation state.
  mountPath: /etc/cloudcrafter/jwt

# ------------------------------------------------------------------------
# LocalStack S3 configuration used by the Tickets service (Task 1 event
# flow). The bucket/endpoint/region are plain configuration, not secrets.
# The access key/secret below are LocalStack's well-known, publicly
# documented dummy credentials ("test"/"test") — they authenticate against
# nothing and are meaningless outside a local LocalStack instance. They are
# templated through a Secret (see templates/tickets-s3-secret.yaml) as good
# practice for *how* credentials should flow into a container, but they are
# NOT sensitive values. Real AWS credentials must never be put in this file
# — for a real AWS account, override this via --set or a separate,
# non-committed values file, the same way the JWT keys are handled.
s3:
  endpoint: "http://host.minikube.internal:4566"
  bucket: "cloudcrafter-ticket-receipts"
  region: "us-east-1"
  accessKeyId: "test"
  secretAccessKey: "test"

# ------------------------------------------------------------------------
# Extra NodePort Service so LocalStack's Lambda (running outside the
# cluster) can reach Notifications — see README.md "Networking" section.
# Only needed for the Task 1 local LocalStack setup; safe to disable in
# environments that don't use it.
# ------------------------------------------------------------------------
notificationsExternal:
  enabled: true
  nodePort: 30080

# ------------------------------------------------------------------------
# Per-microservice configuration. Every field here is what previously would
# have been hardcoded in k8s/*.yaml — image, ports, replicas, resources,
# probes, and extra env vars are all driven from here, per service.
# ------------------------------------------------------------------------
services:
  users:
    image:
      repository: users
      tag: "1.0"
    replicas: 1
    containerPort: 3000
    servicePort: 3000
    apiPath: /api/users
    jwtSecretMount: true
    s3Env: false
    extraEnv: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      path: /health
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3

  events:
    image:
      repository: events
      tag: "1.0"
    replicas: 1
    containerPort: 3000
    servicePort: 3000
    apiPath: /api/events
    jwtSecretMount: false
    s3Env: false
    extraEnv: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      path: /health
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3

  tickets:
    image:
      repository: tickets
      tag: "1.0"
    replicas: 1
    containerPort: 3000
    servicePort: 3000
    apiPath: /api/tickets
    jwtSecretMount: false
    s3Env: true
    extraEnv: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      path: /health
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3

  notifications:
    image:
      repository: notifications
      tag: "1.0"
    replicas: 1
    containerPort: 3000
    servicePort: 3000
    apiPath: /api/notifications
    jwtSecretMount: false
    s3Env: false
    extraEnv: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      path: /health
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
