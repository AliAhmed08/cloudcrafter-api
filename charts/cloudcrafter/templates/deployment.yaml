{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudcrafter.serviceFullname" (dict "name" $name) }}
  {{- with (include "cloudcrafter.namespace" $) }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "cloudcrafter.selectorLabels" (dict "name" $name) | nindent 4 }}
    {{- include "cloudcrafter.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "cloudcrafter.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudcrafter.selectorLabels" (dict "name" $name) | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- $repository := $svc.image.repository }}
          {{- if $.Values.imageRegistry }}
          {{- $repository = printf "%s/cloudcrafter-%s" $.Values.imageRegistry $name }}
          {{- end }}
          {{- $tag := $svc.image.tag }}
          {{- if $.Values.imageTag }}
          {{- $tag = $.Values.imageTag }}
          {{- end }}
          image: "{{ $repository }}:{{ $tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          {{- if or $svc.jwtSecretMount $svc.s3Env $svc.extraEnv }}
          env:
            {{- if $svc.jwtSecretMount }}
            - name: JWT_KEYS_DIR
              value: {{ $.Values.jwt.mountPath | quote }}
            {{- end }}
            {{- if $svc.s3Env }}
            - name: S3_ENDPOINT
              value: {{ $.Values.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ $.Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ $.Values.s3.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudcrafter.serviceFullname" (dict "name" "tickets") }}-s3-credentials
                  key: accessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudcrafter.serviceFullname" (dict "name" "tickets") }}-s3-credentials
                  key: secretAccessKey
            {{- end }}
            {{- range $svc.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $svc.jwtSecretMount }}
            - name: jwt-keys
              mountPath: {{ $.Values.jwt.mountPath }}
              readOnly: true
            {{- end }}

          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $svc.jwtSecretMount }}
        - name: jwt-keys
          secret:
            secretName: {{ $.Values.jwt.existingSecret }}
            # No `items` restriction: previous-public.key/previous-kid only
            # exist during an active rotation grace period (see
            # docs/jwt-key-rotation.md) — pinning specific items would fail
            # pod startup whenever they're absent, which is the normal state.
        {{- end }}
---
{{- end }}
