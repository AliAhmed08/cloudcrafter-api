apiVersion: v2
name: cloudcrafter
description: >-
  CloudCrafter API — a single parent Helm chart deploying all four
  microservices (Users, Events, Tickets, Notifications), Ingress, and the
  Task 1 event-driven Tickets->S3 configuration as one release.
type: application

# Chart version: bumped whenever the TEMPLATES/structure of this chart change
# (independent of the application's own versioning) — e.g. 0.1.0 -> 0.2.0 here
# for Task 2's imageRegistry/imageTag override mechanism (see values.yaml).
# App version: tracks the version of the CloudCrafter application itself,
# driven by the image tags in values.yaml (or by imageTag when set).
#
# This distinction matters: the chart's own packaging/templates can change
# (new values, new resources, refactored templates) independently of
# whether the application code inside the containers changed at all, and
# vice versa — a new application release (new appVersion / new image tag)
# doesn't necessarily require any chart template change.
#
# Versioning policy for now: both are bumped manually, only when something
# actually changes — not on every edit (see README.md "Helm versioning" for
# the planned CI automation, which is not yet implemented).
#
# 0.2.0 -> 0.3.0 (Task 2B): added the imagePullSecrets mechanism for private
# GHCR support (see values.yaml). No application code changed, so appVersion
# stays 1.0.0.
# 0.3.0 -> 0.4.0: JWT rotation support (current/previous kid-based keys —
# see docs/jwt-key-rotation.md) and pod/container securityContext hardening
# (Phase 9). appVersion bumped to 1.1.0 since server.js's actual JWT
# verification logic changed (kid-based key lookup), not just chart plumbing.
version: 0.4.0
appVersion: "1.1.0"

keywords:
  - cloudcrafter
  - capstone
  - microservices
home: https://github.com/AliAhmed08/cloudcrafter-api
sources:
  - https://github.com/AliAhmed08/cloudcrafter-api
