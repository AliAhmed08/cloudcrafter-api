name: Release (build & publish images to GHCR)

# Builds and publishes all four service images to GitHub Container Registry.
#
# Triggers:
#   - push to main            -> tags: sha-<short-sha>, and "edge" (a moving
#                                 convenience tag for the latest main build —
#                                 NOT relied on exclusively; sha- is always
#                                 present too, per README.md "Image tagging").
#   - push of a version tag    -> tags: sha-<short-sha>, <version> (e.g.
#     (vX.Y.Z)                   "1.2.3"), <major>.<minor> (e.g. "1.2"), and
#                                 "latest".
#   - manual dispatch          -> same as a main push (sha- tag only).
#
# Uses only the built-in GITHUB_TOKEN for GHCR authentication — no PAT, no
# registry credentials need to be created or stored as repository secrets.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [users, events, tickets, notifications]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the repository owner
        id: owner
        # GHCR image paths must be lowercase; github.repository_owner is not
        # guaranteed to be (e.g. an org or user with capital letters).
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/cloudcrafter-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print published image references
        run: |
          echo "Published:"
          echo "${{ steps.meta.outputs.tags }}"
